<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <!--
    Station Layout Builder — Version Zero

    Baseline rules:
    - Single source of truth: STATE
    - Mount-point-only HTML
    - UI rendered from constants + state
    - Pointer events only
    - No native HTML drag/drop API
    - Snap-to-grid is OFF
    - Overlap is ALLOWED
    - Large open canvas: 1800 × 1200
    - Normal prototype pan sizes
    - Deferred features stay modeled behind FEATURE_FLAGS
    - DOM reflects STATE

    Known deferred items:
    - Rotation swaps width/height; it does not use CSS rotate().
    - SCALE.print and SCALE.dpi are modeled for future print work.
    - BRAND.primary is modeled for future branding work.
    - Selftest is modeled behind FEATURE_FLAGS.selftest and intentionally not active.
  -->

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Station Layout Builder</title>

  <style>
    /* ============ SECTION: CSS TOKENS ============ */
    :root {
      --color-bg: #eef1f6;
      --color-surface: #ffffff;
      --color-surface-2: #f7f9fc;
      --color-border: #e1e5ec;
      --color-border-strong: #c6cdd8;
      --color-text: #1b2330;
      --color-muted: #5d6b7d;
      --color-primary: #2f6fed;
      --color-primary-hover: #2860d4;
      --color-primary-soft: rgba(47, 111, 237, 0.12);
      --color-danger: #d23b3b;
      --color-danger-soft: rgba(210, 59, 59, 0.10);
      --color-grid: rgba(27, 35, 48, 0.06);

      /* Item type accents (kept in sync with palette swatches) */
      --type-pan: #8a93a3;
      --type-rail: #3b82c4;
      --type-hot: #e07a4f;
      --type-note: #e0b73a;
      --type-block: #7c8595;

      --font-base: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      --font-size-ui: 14px;
      --font-size-item-name: 13px;
      --font-size-item-notes: 11px;

      --space-xs: 4px;
      --space-sm: 8px;
      --space-md: 14px;
      --space-lg: 20px;

      --radius-ui: 8px;
      --radius-item: 6px;

      /* Layered, soft elevation -- multiple thin shadows stacked rather than
         one heavy one, closer to how real ambient + key light separates. */
      --shadow-xs: 0 1px 1px rgba(27, 35, 48, 0.05);
      --shadow-sm: 0 1px 1px rgba(27, 35, 48, 0.04), 0 2px 4px rgba(27, 35, 48, 0.05), 0 1px 2px rgba(27, 35, 48, 0.06);
      --shadow-md: 0 1px 2px rgba(27, 35, 48, 0.05), 0 4px 8px rgba(27, 35, 48, 0.06), 0 8px 16px rgba(27, 35, 48, 0.07);
      --shadow-lg: 0 2px 4px rgba(27, 35, 48, 0.06), 0 8px 16px rgba(27, 35, 48, 0.09), 0 16px 32px rgba(27, 35, 48, 0.12);

      /* Shared motion language: one standard ease for state changes, one
         gentle overshoot-free "spring" feel for press/selection feedback. */
      --ease-standard: cubic-bezier(0.4, 0, 0.2, 1);
      --ease-spring: cubic-bezier(0.34, 1.2, 0.64, 1);

      /* Panel "glass" materials (header/sidebar/editor-panel/status-bar only --
         never the canvas or canvas items, which must stay fully opaque). */
      --glass-bg: rgba(255, 255, 255, 0.78);
      --glass-blur: 20px;

      --canvas-w: 1800px;
      --canvas-h: 1200px;
      --grid-size: 24px;

      --z-item: 10;
      --z-selected: 20;
      --z-panel: 30;

      /* Header-region tokens (design-header pass) */
      --header-toolbar-gap: 6px;
      --header-divider-color: var(--color-border);

      /* Palette/sidebar tokens (design-palette pass) */
      --palette-icon-size: 30px;
      --palette-card-radius: 10px;

      /* Canvas/editor tokens (design-canvas pass) */
      --canvas-editor-icon-size: 22px;
      --canvas-editor-group-bg: rgba(27, 35, 48, 0.025);
    }

    /* ============ SECTION: BASE ============ */
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      height: 100%;
    }

    body {
      overflow: hidden;
      background: var(--color-bg);
      color: var(--color-text);
      font-family: var(--font-base);
      font-size: var(--font-size-ui);
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    button,
    input,
    select,
    textarea {
      min-height: 40px;
    }

    button {
      border: 1px solid var(--color-border-strong);
      background: var(--color-surface);
      color: var(--color-text);
      border-radius: var(--radius-ui);
      padding: var(--space-sm) var(--space-md);
      font-weight: 600;
      cursor: pointer;
      box-shadow: var(--shadow-xs);
      transition: background 160ms var(--ease-standard), border-color 160ms var(--ease-standard),
        box-shadow 160ms var(--ease-standard), transform 160ms var(--ease-spring);
    }

    button:hover {
      border-color: var(--color-primary);
      background: var(--color-surface-2);
      box-shadow: var(--shadow-sm);
    }

    button:active {
      transform: scale(0.97);
      box-shadow: none;
      transition-duration: 80ms;
    }

    button:focus-visible,
    input:focus-visible,
    select:focus-visible,
    textarea:focus-visible,
    [tabindex]:focus-visible {
      outline: 3px solid var(--color-primary);
      outline-offset: 2px;
      transition: outline-offset 120ms var(--ease-standard);
    }

    button.primary {
      background: var(--color-primary);
      border-color: var(--color-primary);
      color: #ffffff;
    }

    button.primary:hover {
      background: var(--color-primary-hover);
      border-color: var(--color-primary-hover);
    }

    button.danger {
      color: var(--color-danger);
      border-color: var(--color-danger);
    }

    button.danger:hover {
      background: var(--color-danger-soft);
    }

    input,
    select,
    textarea {
      width: 100%;
      border: 1px solid var(--color-border-strong);
      border-radius: var(--radius-ui);
      background: var(--color-surface);
      color: var(--color-text);
      padding: var(--space-sm);
      transition: border-color 160ms var(--ease-standard), box-shadow 160ms var(--ease-standard);
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: var(--color-primary);
      box-shadow: 0 0 0 3px var(--color-primary-soft);
    }

    textarea {
      min-height: 82px;
      resize: vertical;
    }

    /* ============ SECTION: LAYOUT ============ */
    .app {
      display: grid;
      grid-template-columns: 260px 1fr 300px;
      grid-template-rows: 58px 1fr 30px;
      height: 100vh;
    }

    .header {
      grid-column: 1 / 4;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 var(--space-lg);
      background: var(--color-surface);
      border-bottom: 1px solid var(--color-border);
      box-shadow: var(--shadow-sm);
      z-index: var(--z-panel);
      gap: var(--space-md);
    }

    .sidebar,
    .editor-panel {
      background: var(--color-surface-2);
      overflow: auto;
      padding: var(--space-md);
    }

    .sidebar {
      border-right: 1px solid var(--color-border);
    }

    .editor-panel {
      border-left: 1px solid var(--color-border);
    }

    .main {
      overflow: auto;
      padding: var(--space-md);
    }

    .status-bar {
      grid-column: 1 / 4;
      display: flex;
      align-items: center;
      gap: var(--space-sm);
      padding: 0 var(--space-lg);
      border-top: 1px solid var(--color-border);
      background: var(--color-surface);
      color: var(--color-muted);
      font-size: 12px;
      transition: color 150ms var(--ease-standard);
    }

    /* Subtle glass material on fixed chrome only -- header, sidebar,
       editor-panel, status-bar. Solid background is the default/fallback;
       @supports upgrades to translucency + blur where available. The canvas
       and canvas-items are intentionally excluded -- they must stay fully
       opaque and readable regardless of browser support. */
    @supports (backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px)) {
      .header,
      .status-bar {
        background: var(--glass-bg);
        backdrop-filter: blur(var(--glass-blur)) saturate(1.4);
        -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(1.4);
      }

      .sidebar,
      .editor-panel {
        background: rgba(247, 249, 252, 0.7);
        backdrop-filter: blur(var(--glass-blur)) saturate(1.2);
        -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(1.2);
      }
    }

    .status-bar::before {
      content: "";
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--status-dot-color, var(--color-primary));
      box-shadow: 0 0 0 3px var(--status-dot-ring, var(--color-primary-soft));
      flex: none;
      transition: background 150ms var(--ease-standard), box-shadow 150ms var(--ease-standard);
    }

    .status-bar[data-tone="warning"] {
      color: var(--color-danger);
    }

    .status-bar[data-tone="warning"]::before {
      background: var(--color-danger);
      box-shadow: 0 0 0 3px var(--color-danger-soft);
      animation: header-status-pulse 1.6s ease-in-out infinite;
    }

    .status-bar[data-tone="success"]::before {
      background: #2f9e5b;
      box-shadow: 0 0 0 3px rgba(47, 158, 91, 0.14);
    }

    @keyframes header-status-pulse {
      0%, 100% { box-shadow: 0 0 0 3px var(--color-danger-soft); }
      50% { box-shadow: 0 0 0 5px var(--color-danger-soft); }
    }

    .status-bar-text {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .section {
      margin-bottom: var(--space-lg);
    }

    .section-title {
      margin: 0 0 var(--space-sm);
      color: var(--color-muted);
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      display: flex;
      align-items: center;
      gap: 6px;
      padding-bottom: var(--space-sm);
      border-bottom: 1px solid var(--color-border);
    }

    .section-title-icon {
      display: inline-flex;
      width: 16px;
      height: 16px;
      color: var(--color-primary);
      flex: none;
    }

    .section-title-icon svg {
      width: 100%;
      height: 100%;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: var(--space-sm);
      min-width: 0;
    }

    .brand-logo-placeholder {
      width: 36px;
      height: 36px;
      border-radius: var(--radius-ui);
      background: linear-gradient(135deg, var(--color-primary), #5b8def);
      display: grid;
      place-items: center;
      color: #ffffff;
      box-shadow: var(--shadow-sm), inset 0 0 0 1px rgba(255, 255, 255, 0.18);
      flex: none;
    }

    .brand-logo-placeholder svg {
      width: 20px;
      height: 20px;
      display: block;
    }

    .brand-text {
      display: flex;
      flex-direction: column;
      line-height: 1.1;
      min-width: 0;
    }

    .brand-title {
      margin: 0;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: -0.01em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .brand-subtitle {
      margin: 1px 0 0;
      font-size: 11px;
      font-weight: 600;
      color: var(--color-muted);
      text-transform: uppercase;
      letter-spacing: 0.07em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .toolbar {
      display: flex;
      align-items: center;
      gap: var(--header-toolbar-gap);
      flex: none;
    }

    .toolbar-group {
      display: flex;
      align-items: center;
      gap: var(--header-toolbar-gap);
    }

    .toolbar-divider {
      width: 1px;
      height: 26px;
      background: var(--header-divider-color);
      margin: 0 var(--space-sm);
      flex: none;
    }

    .toolbar button {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }

    .header-icon {
      width: 16px;
      height: 16px;
      flex: none;
      display: block;
    }

    .header-icon * {
      vector-effect: non-scaling-stroke;
    }

    /* ============ SECTION: COMPONENTS ============ */
    .palette {
      display: grid;
      gap: var(--space-sm);
    }

    .palette-item {
      position: relative;
      text-align: left;
      width: 100%;
      padding: var(--space-sm) var(--space-md);
      padding-left: calc(var(--space-md) + 10px);
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      display: flex;
      align-items: center;
      gap: var(--space-sm);
      border-radius: var(--palette-card-radius);
      background: var(--color-surface);
      transition: transform 200ms var(--ease-spring), box-shadow 200ms var(--ease-standard),
        border-color 160ms var(--ease-standard);
    }

    .palette-item::before {
      content: "";
      position: absolute;
      left: 6px;
      top: 8px;
      bottom: 8px;
      width: 4px;
      border-radius: 2px;
      background: var(--type-color, var(--color-border-strong));
    }

    .palette-item[data-type="pan"] { --type-color: var(--type-pan); }
    .palette-item[data-type="rail"] { --type-color: var(--type-rail); }
    .palette-item[data-type="hot"] { --type-color: var(--type-hot); }
    .palette-item[data-type="note"] { --type-color: var(--type-note); }
    .palette-item[data-type="block"] { --type-color: var(--type-block); }

    .palette-item:hover {
      transform: translateY(-1px);
      box-shadow: var(--shadow-md);
      border-color: var(--type-color, var(--color-primary));
    }

    .palette-item:active {
      transform: translateY(-1px) scale(0.98);
      transition-duration: 80ms;
    }

    .palette-type-icon {
      flex: none;
      width: var(--palette-icon-size);
      height: var(--palette-icon-size);
      border-radius: 8px;
      display: grid;
      place-items: center;
      background: color-mix(in srgb, var(--type-color, var(--color-border-strong)) 16%, var(--color-surface));
      box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--type-color, var(--color-border-strong)) 35%, transparent);
    }

    .palette-type-icon svg {
      width: 18px;
      height: 18px;
      display: block;
    }

    .palette-item-body {
      flex: 1 1 auto;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .palette-item-top {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: var(--space-sm);
    }

    .palette-item-name {
      display: block;
      font-weight: 700;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .palette-item-meta {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 0;
      color: var(--color-muted);
      font-size: 12px;
    }

    .palette-item-typelabel {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .palette-size-pill {
      flex: none;
      display: inline-flex;
      align-items: center;
      padding: 1px 7px;
      border-radius: 999px;
      background: var(--color-surface-2);
      border: 1px solid var(--color-border);
      color: var(--color-muted);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.01em;
      font-variant-numeric: tabular-nums;
    }

    .canvas-wrap {
      width: var(--canvas-w);
      max-width: none;
    }

    .canvas {
      position: relative;
      width: var(--canvas-w);
      height: var(--canvas-h);
      border: 1px solid var(--color-border-strong);
      border-radius: var(--radius-ui);
      background:
        linear-gradient(90deg, var(--color-grid) 1px, transparent 1px),
        linear-gradient(var(--color-grid) 1px, transparent 1px),
        var(--color-surface);
      background-size: var(--grid-size) var(--grid-size);
      box-shadow: var(--shadow-md);
      overflow: hidden;
      contain: layout paint;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }

    /* Empty state is now a real child element (.canvas-empty-state) rendered by
       render_canvas, rather than a ::before/content(attr) pseudo-element. This
       gives layout control for the illustration + text. data-state="empty"/"ready"
       still toggles via container.dataset.state exactly as before. */
    .canvas-empty-state {
      position: absolute;
      inset: var(--space-md);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: var(--space-md);
      border: 2px dashed var(--color-border-strong);
      border-radius: var(--radius-ui);
      color: var(--color-muted);
      font-size: 15px;
      text-align: center;
      padding: var(--space-lg);
      pointer-events: none;
    }

    .canvas[data-state="empty"] .canvas-empty-state {
      display: flex;
    }

    .canvas-empty-illustration {
      width: 132px;
      height: 96px;
      opacity: 0.85;
    }

    .canvas-empty-text {
      max-width: 360px;
      margin: 0;
      line-height: 1.5;
    }

    .canvas-item {
      position: absolute;
      z-index: var(--z-item);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      border: 1px solid var(--type-color, var(--color-border-strong));
      border-left: 4px solid var(--type-color, var(--color-border-strong));
      border-radius: var(--radius-item);
      background: var(--type-fill, #eef0f3);
      box-shadow: var(--shadow-sm);
      padding: var(--space-xs);
      cursor: move;
      overflow: hidden;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      transition: box-shadow 180ms var(--ease-standard), border-color 180ms var(--ease-standard);
    }

    .canvas-item:hover {
      box-shadow: var(--shadow-md);
    }

    .canvas-item[data-type="pan"] {
      --type-color: var(--type-pan);
      --type-fill: #eceef2;
    }

    .canvas-item[data-type="rail"] {
      --type-color: var(--type-rail);
      --type-fill: #e3eef9;
    }

    .canvas-item[data-type="hot"] {
      --type-color: var(--type-hot);
      --type-fill: #fbe9df;
    }

    .canvas-item[data-type="note"] {
      --type-color: var(--type-note);
      --type-fill: #fdf3d2;
    }

    .canvas-item[data-type="block"] {
      --type-color: var(--type-block);
      --type-fill: #ebedf1;
    }

    .canvas-item[data-selected="true"] {
      z-index: var(--z-selected);
      outline: 3px solid var(--color-primary);
      outline-offset: 2px;
      box-shadow: var(--shadow-lg);
    }

    .canvas-item[data-dragging="true"] {
      opacity: 0.9;
      box-shadow: var(--shadow-lg);
      will-change: transform;
    }

    .canvas-item[data-colliding="true"] {
      outline: 3px dashed var(--color-danger);
      outline-offset: 2px;
    }

    .canvas-item[data-colliding="true"][data-selected="true"] {
      outline: 3px solid var(--color-primary);
      outline-offset: 2px;
      box-shadow: var(--shadow-lg), inset 0 0 0 3px var(--color-danger);
    }

    /* Per-type icon badge inside each canvas item, reusing the same accent
       color already established by --type-color on the left border. */
    .canvas-item-icon {
      display: flex;
      align-items: center;
      justify-content: center;
      width: var(--canvas-editor-icon-size);
      height: var(--canvas-editor-icon-size);
      margin-bottom: 2px;
      border-radius: 999px;
      background: var(--type-color, var(--color-border-strong));
      color: #ffffff;
      flex: none;
    }

    .canvas-item-icon svg {
      width: 13px;
      height: 13px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .canvas-item-body {
      display: flex;
      flex-direction: column;
      align-items: center;
      min-width: 0;
      max-width: 100%;
    }

    .item-name {
      font-size: var(--font-size-item-name);
      font-weight: 700;
      line-height: 1.15;
      overflow-wrap: anywhere;
    }

    .item-notes {
      margin-top: var(--space-xs);
      color: var(--color-muted);
      font-size: var(--font-size-item-notes);
      line-height: 1.15;
      overflow-wrap: anywhere;
    }

    .field {
      margin-bottom: var(--space-md);
    }

    .field label {
      display: block;
      margin-bottom: var(--space-xs);
      color: var(--color-muted);
      font-weight: 700;
      font-size: 12px;
    }

    .field-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: var(--space-sm);
    }

    .actions-three {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: var(--space-sm);
    }

    /* Editor inspector groupings (canvas/editor agent territory) */
    .editor-group {
      margin-bottom: var(--space-lg);
      padding: var(--space-md);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-ui);
      background: var(--canvas-editor-group-bg);
    }

    .editor-group:last-of-type {
      margin-bottom: var(--space-md);
    }

    .editor-group-title {
      margin: 0 0 var(--space-sm);
      color: var(--color-muted);
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .editor-group .field:last-child,
    .editor-group .field-row:last-child {
      margin-bottom: 0;
    }

    .editor-rotation-line {
      display: flex;
      align-items: center;
      gap: var(--space-sm);
      margin: 0 0 var(--space-md);
      color: var(--color-muted);
      font-size: 12px;
    }

    .editor-rotation-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 22px;
      height: 22px;
      flex: none;
      border-radius: 999px;
      background: var(--color-primary-soft);
      color: var(--color-primary);
      transition: transform 240ms var(--ease-spring);
    }

    .editor-rotation-icon[data-rotated="true"] {
      transform: rotate(90deg);
    }

    .editor-rotation-icon svg {
      width: 13px;
      height: 13px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .editor-icon-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .editor-icon-btn svg {
      width: 15px;
      height: 15px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      flex: none;
    }

    .empty-state,
    .error-state {
      border: 1px dashed var(--color-border-strong);
      border-radius: var(--radius-ui);
      background: var(--color-surface);
      padding: var(--space-md);
      color: var(--color-muted);
      line-height: 1.4;
    }

    .error-state {
      color: var(--color-danger);
      border-color: var(--color-danger);
      background: var(--color-danger-soft);
    }

    .json-box {
      min-height: 130px;
      font-family: Consolas, Monaco, monospace;
      font-size: 12px;
      background: var(--color-surface-2);
      border-color: var(--color-border-strong);
      line-height: 1.5;
      box-shadow: inset 0 1px 2px rgba(27, 35, 48, 0.05);
    }

    .json-box:focus {
      background: var(--color-surface);
    }

    /* Storage section grouping (design-palette agent) */
    .storage-actions {
      display: flex;
      flex-direction: column;
      gap: var(--space-sm);
      padding: var(--space-sm);
      margin-bottom: var(--space-md);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-ui);
      background: var(--color-surface);
    }

    .storage-actions-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: var(--space-sm);
    }

    .storage-actions-row > button {
      width: 100%;
    }

    .storage-actions .danger {
      width: 100%;
    }

    .print-note {
      color: var(--color-muted);
      font-size: 12px;
    }

    .metadata-line {
      margin: 0 0 var(--space-md);
      color: var(--color-muted);
      font-size: 12px;
    }

    @media (max-width: 1000px) {
      .app {
        grid-template-columns: 230px 1fr;
      }

      .header {
        grid-column: 1 / 3;
      }

      .editor-panel {
        display: none;
      }

      .status-bar {
        grid-column: 1 / 3;
      }

      .brand-subtitle {
        display: none;
      }

      .toolbar {
        gap: 4px;
      }

      .toolbar-divider {
        margin: 0 var(--space-xs);
      }

      .toolbar button span.toolbar-btn-label {
        display: none;
      }

      .toolbar button {
        padding: var(--space-sm);
      }
    }

    /* ============ SECTION: PRINT ============ */
    @media print {
      @page {
        size: 8.5in 11in landscape;
        margin: 0.25in;
      }

      html,
      body,
      * {
        print-color-adjust: exact;
        -webkit-print-color-adjust: exact;
      }

      body {
        overflow: visible;
        background: white;
      }

      .header,
      .sidebar,
      .editor-panel,
      .status-bar,
      .print-note {
        display: none !important;
      }

      .app {
        display: block;
        height: auto;
      }

      .main {
        padding: 0;
        overflow: visible;
      }

      .canvas {
        width: 1800px;
        height: 1200px;
        transform: scale(0.56);
        transform-origin: top left;
        break-inside: avoid;
        page-break-inside: avoid;
      }
    }
  </style>
</head>

<body>
  <div id="app" class="app">
    <header id="brandHeader" class="header"></header>
    <aside id="leftPanel" class="sidebar"></aside>
    <main id="mainPanel" class="main"></main>
    <aside id="rightPanel" class="editor-panel"></aside>
    <div id="statusBar" class="status-bar" aria-live="polite"></div>
  </div>

  <script>
    /* ============ SECTION: CONFIG ============ */
    const APP_VERSION = "0.0.0";

    const FEATURE_FLAGS = {
      branding: false,
      snapToGrid: true,
      collisionDetection: true,
      print: true,
      importExport: true,
      localStorage: true,
      keyboardShortcuts: true,
      selftest: true
    };

    /* ============ SECTION: BRAND ============ */
    const BRAND = {
      name: "Station Layout Builder",
      logo: "",
      icon: "",
      primary: "#222222",
      enabled: false
    };

    /* ============ SECTION: CONSTANTS ============ */
    const SCALE = {
      canvas: { w: 1800, h: 1200 },
      print: { w: "10.5in", h: "6in" },
      dpi: 96
    };

    const GRID_SIZE = 24;

    const COPY = {
      appName: "Station Layout Builder",
      appTagline: "Kitchen Line Planner",
      sectionPalette: "Palette",
      sectionStorage: "Storage",
      sectionSelectedItem: "Selected Item",
      emptyCanvas: "Select an item from the palette, then place it on the canvas.",
      noSelection: "Select an item on the canvas to edit its name, notes, type, size, or position.",
      storageSaved: "Saved",
      storageLoaded: "Loaded",
      storageUnavailable: "Storage is unavailable. Data may only last for this session.",
      storageFull: "Storage is full. Export your JSON before adding more data.",
      importError: "Could not import JSON.",
      exportReady: "Exported JSON.",
      collisionsPresent: "Overlapping items detected",
      printNote: "For best print results use Chrome and set margins to None in the print dialog.",
      save: "Save",
      load: "Load",
      snapToggle: "Snap to Grid",
      print: "Print",
      exportJson: "Export JSON",
      importJson: "Import JSON",
      clearLayout: "Clear Layout",
      clearConfirm: "Clear the entire layout? This cannot be undone.",
      layoutCleared: "Cleared layout",
      layoutJson: "Layout JSON",
      name: "Name",
      notesTooling: "Notes / Tooling",
      type: "Type",
      width: "Width",
      height: "Height",
      x: "X",
      y: "Y",
      rotate: "Rotate",
      duplicate: "Duplicate",
      delete: "Delete",
      logo: "Logo"
    };

    const ITEM_TYPES = [
      { id: "pan", label: "Pan" },
      { id: "rail", label: "Station Rail" },
      { id: "hot", label: "Hot Well" },
      { id: "note", label: "Note" },
      { id: "block", label: "Block" }
    ];

    const PALETTE_ITEMS = [
      { id: "pan-1-9", name: "1/9 Pan", type: "pan", w: 80, h: 120 },
      { id: "pan-1-6", name: "1/6 Pan", type: "pan", w: 120, h: 120 },
      { id: "pan-1-3", name: "1/3 Pan", type: "pan", w: 120, h: 240 },
      { id: "pan-1-2", name: "1/2 Pan", type: "pan", w: 180, h: 240 },
      { id: "full-hotel", name: "Full Hotel", type: "rail", w: 360, h: 240 },
      { id: "cold-rail", name: "Cold Rail", type: "rail", w: 600, h: 240 },
      { id: "hot-well", name: "Hot Well", type: "hot", w: 480, h: 240 },
      { id: "prep-note", name: "Prep Note", type: "note", w: 220, h: 100 },
      { id: "custom-block", name: "Custom Block", type: "block", w: 200, h: 120 }
    ];

    const KEYS = {
      SAVE: "ctrl+s",
      PRINT: "ctrl+p",
      DUPLICATE: "ctrl+d",
      ROTATE: "r",
      DELETE: "delete",
      BACKSPACE: "backspace",
      ARROW_UP: "arrowup",
      ARROW_DOWN: "arrowdown",
      ARROW_LEFT: "arrowleft",
      ARROW_RIGHT: "arrowright"
    };

    const STORAGE_KEY = "station-layout-builder.version-zero";

    /* ============ SECTION: SCHEMA ============ */
    const SCHEMA_VERSION = 1;

    function schema_createEmptyLayout() {
      return {
        schemaVersion: SCHEMA_VERSION,
        appVersion: APP_VERSION,
        brand: {
          name: BRAND.name,
          logo: BRAND.logo,
          icon: BRAND.icon,
          enabled: BRAND.enabled
        },
        items: []
      };
    }

    function schema_normalizeItem(item) {
      const fallback = PALETTE_ITEMS[0];

      return {
        id: item.id || util_id("item"),
        sourceId: item.sourceId || fallback.id,
        name: item.name || fallback.name,
        notes: item.notes || "",
        type: item.type || fallback.type,
        x: util_number(item.x, 40),
        y: util_number(item.y, 40),
        w: Math.max(20, util_number(item.w, fallback.w)),
        h: Math.max(20, util_number(item.h, fallback.h)),
        rotation: util_number(item.rotation, 0),
        z: util_number(item.z, 1)
      };
    }

    function schema_normalizeLayout(layout) {
      const base = schema_createEmptyLayout();

      if (!layout || typeof layout !== "object") {
        return base;
      }

      return {
        schemaVersion: SCHEMA_VERSION,
        appVersion: layout.appVersion || APP_VERSION,
        brand: Object.assign(base.brand, layout.brand || {}),
        items: Array.isArray(layout.items)
          ? layout.items.map(schema_normalizeItem)
          : []
      };
    }

    /* ============ SECTION: STATE ============ */
    const STATE = {
      schemaVersion: SCHEMA_VERSION,
      appVersion: APP_VERSION,
      brand: {
        name: BRAND.name,
        logo: BRAND.logo,
        icon: BRAND.icon,
        enabled: BRAND.enabled
      },
      items: [],
      selectedId: null,
      revision: 0,
      status: "Ready",
      ui: {
        snapToGrid: FEATURE_FLAGS.snapToGrid,
        dragging: null,
        storageMode: "local",
        jsonDraft: ""
      }
    };

    /* ============ SECTION: BUS ============ */
    const Bus = {
      events: new Map(),

      on(eventName, callback) {
        if (!this.events.has(eventName)) {
          this.events.set(eventName, new Set());
        }

        this.events.get(eventName).add(callback);

        return () => this.off(eventName, callback);
      },

      off(eventName, callback) {
        const callbacks = this.events.get(eventName);
        if (!callbacks) return;
        callbacks.delete(callback);
      },

      emit(eventName, payload) {
        const callbacks = this.events.get(eventName);
        if (!callbacks) return;

        callbacks.forEach((callback) => {
          callback(payload);
        });
      }
    };

    /* ============ SECTION: STORAGE ============ */
    const MemoryStore = {};

    function storage_getStorage() {
      if (!FEATURE_FLAGS.localStorage) {
        STATE.ui.storageMode = "memory";
        return null;
      }

      try {
        const testKey = "__station_builder_test__";
        window.localStorage.setItem(testKey, "1");
        window.localStorage.removeItem(testKey);
        return window.localStorage;
      } catch {
        STATE.ui.storageMode = "memory";
        return null;
      }
    }

    function storage_isQuotaError(error) {
      return error &&
        (
          error.name === "QuotaExceededError" ||
          error.name === "NS_ERROR_DOM_QUOTA_REACHED" ||
          error.code === 22 ||
          error.code === 1014
        );
    }

    function storage_save(options = {}) {
      const shouldAnnounce = options.announce === true;

      const layout = {
        schemaVersion: STATE.schemaVersion,
        appVersion: STATE.appVersion,
        brand: STATE.brand,
        items: STATE.items
      };

      const payload = JSON.stringify(layout);
      const storage = storage_getStorage();

      if (!storage) {
        MemoryStore[STORAGE_KEY] = payload;

        if (shouldAnnounce) {
          action_setStatus(COPY.storageUnavailable);
        }

        return false;
      }

      try {
        storage.setItem(STORAGE_KEY, payload);

        if (shouldAnnounce) {
          action_setStatus(COPY.storageSaved);
        }

        return true;
      } catch (error) {
        if (storage_isQuotaError(error)) {
          action_setStatus(COPY.storageFull);
          return false;
        }

        action_setStatus(COPY.storageUnavailable);
        return false;
      }
    }

    function storage_load() {
      const storage = storage_getStorage();
      let raw = null;

      if (storage) {
        raw = storage.getItem(STORAGE_KEY);
      } else {
        raw = MemoryStore[STORAGE_KEY] || null;
      }

      if (!raw) return schema_createEmptyLayout();

      try {
        return schema_normalizeLayout(JSON.parse(raw));
      } catch {
        return schema_createEmptyLayout();
      }
    }

    /* ============ SECTION: SELECTORS ============ */
    function select_selectedItem() {
      return STATE.items.find((item) => item.id === STATE.selectedId) || null;
    }

    function select_itemById(id) {
      return STATE.items.find((item) => item.id === id) || null;
    }

    function select_paletteItem(id) {
      return PALETTE_ITEMS.find((item) => item.id === id) || null;
    }

    function select_itemType(id) {
      return ITEM_TYPES.find((type) => type.id === id) || ITEM_TYPES[0];
    }

    /* ============ SECTION: ACTIONS ============ */
    function action_commit(reason) {
      STATE.revision += 1;
      Bus.emit("state:changed", { reason, revision: STATE.revision });
    }

    function action_setStatus(message) {
      STATE.status = message;
      action_commit("status");
    }

    function action_hydrate(layout) {
      const normalized = schema_normalizeLayout(layout);

      STATE.schemaVersion = normalized.schemaVersion;
      STATE.appVersion = normalized.appVersion;
      STATE.brand = normalized.brand;
      STATE.items = normalized.items;
      STATE.selectedId = null;

      action_commit("hydrate");
    }

    function action_addItemFromPalette(sourceId, x, y) {
      const source = select_paletteItem(sourceId);
      if (!source) return;

      let placedX = x;
      let placedY = y;

      if (STATE.ui.snapToGrid) {
        placedX = util_snap(placedX);
        placedY = util_snap(placedY);
      }

      const item = schema_normalizeItem({
        id: util_id("item"),
        sourceId: source.id,
        name: source.name,
        notes: "",
        type: source.type,
        x: placedX,
        y: placedY,
        w: source.w,
        h: source.h,
        rotation: 0,
        z: STATE.items.length + 1
      });

      util_clampItem(item);

      STATE.items.push(item);
      STATE.selectedId = item.id;

      action_setStatus("Placed " + item.name);
      storage_save();
      action_commit("add-item");
    }

    function action_selectItem(id) {
      STATE.selectedId = id;
      action_commit("select-item");
    }

    function action_clearSelection() {
      STATE.selectedId = null;
      action_commit("clear-selection");
    }

    function action_updateSelected(patch) {
      const item = select_selectedItem();
      if (!item) return;

      Object.assign(item, patch);
      util_clampItem(item);

      action_commit("update-selected");
      storage_save();
    }

    function action_deleteSelected() {
      if (!STATE.selectedId) return;

      STATE.items = STATE.items.filter((item) => item.id !== STATE.selectedId);
      STATE.selectedId = null;

      action_setStatus("Deleted item");
      storage_save();
      action_commit("delete-selected");
    }

    function action_duplicateSelected() {
      const item = select_selectedItem();
      if (!item) return;

      const copy = schema_normalizeItem({
        ...item,
        id: util_id("item"),
        name: item.name + " Copy",
        x: item.x + 20,
        y: item.y + 20,
        z: STATE.items.length + 1
      });

      util_clampItem(copy);

      STATE.items.push(copy);
      STATE.selectedId = copy.id;

      action_setStatus("Duplicated item");
      storage_save();
      action_commit("duplicate-selected");
    }

    function action_rotateSelected() {
      const item = select_selectedItem();
      if (!item) return;

      const oldWidth = item.w;
      item.w = item.h;
      item.h = oldWidth;
      item.rotation = item.rotation === 90 ? 0 : 90;

      util_clampItem(item);

      action_setStatus("Rotated " + item.name);
      storage_save();
      action_commit("rotate-selected");
    }

    function action_clearLayout() {
      STATE.items = [];
      STATE.selectedId = null;

      action_setStatus(COPY.layoutCleared);
      storage_save();
      action_commit("clear-layout");
    }

    function action_toggleSnapToGrid() {
      STATE.ui.snapToGrid = !STATE.ui.snapToGrid;

      action_setStatus(STATE.ui.snapToGrid ? "Snap to Grid on" : "Snap to Grid off");
      action_commit("toggle-snap-to-grid");
    }

    function action_importJson(raw) {
      if (!FEATURE_FLAGS.importExport) return;

      try {
        const parsed = JSON.parse(raw);
        action_hydrate(parsed);
        action_setStatus(COPY.storageLoaded);
        storage_save();
      } catch {
        action_setStatus(COPY.importError);
      }
    }

    function action_exportJson() {
      if (!FEATURE_FLAGS.importExport) return;

      const layout = {
        schemaVersion: STATE.schemaVersion,
        appVersion: STATE.appVersion,
        brand: STATE.brand,
        items: STATE.items
      };

      STATE.ui.jsonDraft = JSON.stringify(layout, null, 2);
      action_setStatus(COPY.exportReady);
    }

    /* ============ SECTION: RENDER ============ */
    const DOM = {
      brandHeader: document.getElementById("brandHeader"),
      leftPanel: document.getElementById("leftPanel"),
      mainPanel: document.getElementById("mainPanel"),
      rightPanel: document.getElementById("rightPanel"),
      statusBar: document.getElementById("statusBar"),
      jsonBox: null,
      canvas: null
    };

    let renderPending = false;

    function render_schedule() {
      if (renderPending) return;

      renderPending = true;

      requestAnimationFrame(() => {
        renderPending = false;
        render_all();
      });
    }

    function render_all() {
      const focusSnapshot = render_captureFocus();

      render_brandHeader(STATE, DOM.brandHeader);
      render_leftPanel(STATE, DOM.leftPanel);
      render_mainPanel(STATE, DOM.mainPanel);
      render_rightPanel(STATE, DOM.rightPanel);
      render_status(STATE, DOM.statusBar);
      render_documentMeta(STATE);

      render_restoreFocus(focusSnapshot);
    }

    function render_captureFocus() {
      const active = document.activeElement;
      if (!active || !active.id) return null;

      const snapshot = { id: active.id };

      if (typeof active.selectionStart === "number") {
        snapshot.selectionStart = active.selectionStart;
        snapshot.selectionEnd = active.selectionEnd;
      }

      return snapshot;
    }

    function render_restoreFocus(snapshot) {
      if (!snapshot) return;

      const el = document.getElementById(snapshot.id);
      if (!el) return;

      el.focus({ preventScroll: true });

      if (typeof snapshot.selectionStart === "number" && typeof el.setSelectionRange === "function") {
        try {
          el.setSelectionRange(snapshot.selectionStart, snapshot.selectionEnd);
        } catch {}
      }
    }

    function render_brandLogoMark() {
      // Simple geometric "station grid" mark: a 2x2 grid of rounded cells
      // echoing the canvas-item / palette grid concept, in the brand gradient.
      const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
      svg.setAttribute("viewBox", "0 0 24 24");
      svg.setAttribute("fill", "none");
      svg.setAttribute("aria-hidden", "true");
      svg.innerHTML =
        '<rect x="3" y="3" width="7.5" height="7.5" rx="1.6" fill="white" fill-opacity="0.95"/>' +
        '<rect x="13.5" y="3" width="7.5" height="7.5" rx="1.6" fill="white" fill-opacity="0.65"/>' +
        '<rect x="3" y="13.5" width="7.5" height="7.5" rx="1.6" fill="white" fill-opacity="0.65"/>' +
        '<rect x="13.5" y="13.5" width="7.5" height="7.5" rx="1.6" fill="white" fill-opacity="0.95"/>';
      return svg;
    }

    function render_toolbarIcon(name) {
      const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
      svg.setAttribute("viewBox", "0 0 16 16");
      svg.setAttribute("fill", "none");
      svg.setAttribute("aria-hidden", "true");
      svg.classList.add("header-icon");

      const paths = {
        save:
          '<path d="M3 2.5h7.5L13.5 5.5V13.5H3z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/>' +
          '<path d="M5.5 2.5V6h5V2.5" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/>' +
          '<path d="M5 9.5h6v4H5z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/>',
        load:
          '<path d="M2.5 5.2A1.7 1.7 0 0 1 4.2 3.5h2.4l1.2 1.4h4.5a1.7 1.7 0 0 1 1.7 1.7v4.7a1.7 1.7 0 0 1-1.7 1.7H4.2a1.7 1.7 0 0 1-1.7-1.7z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/>' +
          '<path d="M8 7.3v3.4M6.5 9.2 8 10.7l1.5-1.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>',
        snap:
          '<path d="M2.5 2.5h2.4v2.4H2.5zM11.1 2.5h2.4v2.4h-2.4zM2.5 11.1h2.4v2.4H2.5zM11.1 11.1h2.4v2.4h-2.4z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/>' +
          '<path d="M5.7 3.7h4.6M3.7 5.7v4.6M12.3 5.7v4.6M5.7 12.3h4.6" stroke="currentColor" stroke-width="1.1" stroke-dasharray="1.6 1.4"/>',
        print:
          '<path d="M4.5 6V2.7h7V6" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/>' +
          '<rect x="2.5" y="6" width="11" height="5" rx="1" stroke="currentColor" stroke-width="1.3"/>' +
          '<path d="M4.5 10.8h7v2.5h-7z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/>'
      };

      svg.innerHTML = paths[name] || "";
      return svg;
    }

    function render_brandHeader(state, container) {
      container.textContent = "";

      const brand = document.createElement("div");
      brand.className = "brand";

      const logo = document.createElement("div");
      logo.className = "brand-logo-placeholder";
      logo.appendChild(render_brandLogoMark());

      const text = document.createElement("div");
      text.className = "brand-text";

      const title = document.createElement("h1");
      title.className = "brand-title";
      title.textContent = FEATURE_FLAGS.branding && state.brand.enabled ? state.brand.name : COPY.appName;

      const subtitle = document.createElement("p");
      subtitle.className = "brand-subtitle";
      subtitle.textContent = COPY.appTagline;

      text.append(title, subtitle);
      brand.append(logo, text);

      const toolbar = document.createElement("div");
      toolbar.className = "toolbar";

      const fileGroup = document.createElement("div");
      fileGroup.className = "toolbar-group";

      const save = render_button("saveBtn", COPY.save, "primary");
      render_toolbarButtonIcon(save, "save");

      const load = render_button("loadBtn", COPY.load);
      render_toolbarButtonIcon(load, "load");

      fileGroup.append(save, load);

      const divider = document.createElement("div");
      divider.className = "toolbar-divider";
      divider.setAttribute("aria-hidden", "true");

      const viewGroup = document.createElement("div");
      viewGroup.className = "toolbar-group";

      const snapToggle = render_button("snapToggleBtn", COPY.snapToggle, state.ui.snapToGrid ? "primary" : null);
      snapToggle.setAttribute("aria-pressed", String(state.ui.snapToGrid));
      render_toolbarButtonIcon(snapToggle, "snap");

      const print = render_button("printBtn", COPY.print);
      render_toolbarButtonIcon(print, "print");

      viewGroup.append(snapToggle, print);

      toolbar.append(fileGroup, divider, viewGroup);
      container.append(brand, toolbar);
    }

    function render_toolbarButtonIcon(buttonEl, iconName) {
      const icon = render_toolbarIcon(iconName);
      const label = document.createElement("span");
      label.className = "toolbar-btn-label";
      label.textContent = buttonEl.textContent;

      buttonEl.textContent = "";
      buttonEl.append(icon, label);
    }

    function render_paletteTypeIcon(type) {
      const wrap = document.createElement("span");
      wrap.className = "palette-type-icon";

    /* ============ SECTION: POINTER ============ */
    const POINTER = {
      mode: null,
      pointerId: null,
      captureTarget: null,
      dragNode: null,
      itemId: null,
      paletteId: null,
      canvasRect: null,
      startClientX: 0,
      startClientY: 0,
      startX: 0,
      startY: 0
    };

    function pointer_down(event) {
      if (event.isPrimary === false) return;
      if (event.button !== undefined && event.button !== 0) return;

      // Only one drag/placement session is supported at a time (POINTER is a
      // singleton, not keyed by pointerId). Without this guard, a second
      // pointerdown -- a stray multi-touch contact, a fast double-click that
      // registers as two pointer ids, etc. -- silently overwrites the
      // in-progress session: the first drag's moves stop applying with no
      // error, and it never receives its own cleanup. Ignoring the second
      // pointerdown outright is safer than corrupting state. Confirmed via
      // stress testing on 2026-06-21; see CLAUDE.md.
      if (POINTER.mode && event.pointerId !== POINTER.pointerId) {
        return;
      }

      const paletteEl = event.target.closest("[data-palette-id]");
      const itemEl = event.target.closest("[data-item-id]");

      if (!paletteEl && !itemEl) return;

      event.preventDefault();

      const captureTarget = itemEl || paletteEl;

      POINTER.pointerId = event.pointerId;
      POINTER.captureTarget = captureTarget;
      POINTER.canvasRect = DOM.canvas ? DOM.canvas.getBoundingClientRect() : null;
      POINTER.startClientX = event.clientX;
      POINTER.startClientY = event.clientY;
      POINTER.dragNode = itemEl || null;

      if (paletteEl) {
        POINTER.mode = "palette";
        POINTER.paletteId = paletteEl.dataset.paletteId;
      }

      if (itemEl) {
        const item = select_itemById(itemEl.dataset.itemId);
        if (!item) return;

        POINTER.mode = "move";
        POINTER.itemId = item.id;
        POINTER.startX = item.x;
        POINTER.startY = item.y;

        STATE.selectedId = item.id;
        STATE.ui.dragging = item.id;
        action_commit("pointer-select");
      }

      if (captureTarget && captureTarget.setPointerCapture) {
        captureTarget.setPointerCapture(event.pointerId);
      }
    }

    function pointer_move(event) {
      if (!POINTER.mode || event.pointerId !== POINTER.pointerId) return;

      event.preventDefault();

      if (POINTER.mode === "move") {
        const item = select_itemById(POINTER.itemId);
        if (!item) return;

        const dx = event.clientX - POINTER.startClientX;
        const dy = event.clientY - POINTER.startClientY;

        item.x = POINTER.startX + dx;
        item.y = POINTER.startY + dy;

        if (STATE.ui.snapToGrid) {
          item.x = util_snap(item.x);
          item.y = util_snap(item.y);
        }

        util_clampItem(item);

        if (POINTER.dragNode) {
          POINTER.dragNode.style.transform = `translate3d(${item.x}px, ${item.y}px, 0)`;
        }
      }
    }

    function pointer_up(event) {
      if (!POINTER.mode || event.pointerId !== POINTER.pointerId) return;

      event.preventDefault();

      if (POINTER.mode === "palette") {
        const rect = POINTER.canvasRect;
        if (rect) {
          const x = event.clientX - rect.left;
          const y = event.clientY - rect.top;
          action_addItemFromPalette(POINTER.paletteId, x, y);
        }
      }

      if (POINTER.mode === "move") {
        action_setStatus("Moved item");
        storage_save();
        action_commit("move-complete");
      }

      pointer_cleanup(event);
    }

    function pointer_cancel(event) {
      pointer_cleanup(event);
    }

    function pointer_cleanup(event) {
      try {
        if (POINTER.captureTarget && POINTER.pointerId !== null && POINTER.captureTarget.releasePointerCapture) {
          POINTER.captureTarget.releasePointerCapture(POINTER.pointerId);
        }
      } catch {}

      POINTER.mode = null;
      POINTER.pointerId = null;
      POINTER.captureTarget = null;
      POINTER.dragNode = null;
      POINTER.itemId = null;
      POINTER.paletteId = null;
      POINTER.canvasRect = null;

      STATE.ui.dragging = null;
      action_commit("pointer-cleanup");
    }

    /* ============ SECTION: HANDLERS ============ */
    function handle_click(event) {
      if (event.target.id === "saveBtn") storage_save({ announce: true });

      if (event.target.id === "loadBtn") {
        action_hydrate(storage_load());
        action_setStatus(COPY.storageLoaded);
      }

      if (event.target.id === "printBtn" && FEATURE_FLAGS.print) {
        window.print();
      }

      if (event.target.id === "snapToggleBtn") action_toggleSnapToGrid();

      if (event.target.id === "rotateBtn") action_rotateSelected();
      if (event.target.id === "duplicateBtn") action_duplicateSelected();
      if (event.target.id === "deleteBtn") action_deleteSelected();

      if (event.target.id === "exportBtn") action_exportJson();
      if (event.target.id === "importBtn") action_importJson(STATE.ui.jsonDraft);

      if (event.target.id === "clearBtn") {
        if (window.confirm(COPY.clearConfirm)) {
          action_clearLayout();
        }
      }

      const canvasItem = event.target.closest("[data-item-id]");

      if (canvasItem) {
        action_selectItem(canvasItem.dataset.itemId);
        return;
      }

      if (DOM.canvas && event.target === DOM.canvas) {
        action_clearSelection();
      }
    }

    function handle_input(event) {
      if (event.target.id === "jsonBox") {
        STATE.ui.jsonDraft = event.target.value;
        action_commit("json-draft");
        return;
      }

      const item = select_selectedItem();
      if (!item) return;

      if (event.target.id === "editName") {
        action_updateSelected({ name: event.target.value });
      }

      if (event.target.id === "editNotes") {
        action_updateSelected({ notes: event.target.value });
      }

      if (event.target.id === "editType") {
        action_updateSelected({ type: event.target.value });
      }

      if (event.target.id === "editW") {
        action_updateSelected({ w: Number(event.target.value) });
      }

      if (event.target.id === "editH") {
        action_updateSelected({ h: Number(event.target.value) });
      }

      if (event.target.id === "editX") {
        action_updateSelected({ x: Number(event.target.value) });
      }

      if (event.target.id === "editY") {
        action_updateSelected({ y: Number(event.target.value) });
      }
    }

    /* ============ SECTION: KEYBOARD ============ */
    function keyboard_key(event) {
      if (!FEATURE_FLAGS.keyboardShortcuts) return;

      const activeTag = document.activeElement.tagName;
      const key = keyboard_getKey(event);

      if (activeTag === "INPUT" || activeTag === "TEXTAREA" || activeTag === "SELECT") {
        return;
      }

      if (key === KEYS.SAVE) {
        event.preventDefault();
        storage_save({ announce: true });
        return;
      }

      if (key === KEYS.PRINT && FEATURE_FLAGS.print) {
        event.preventDefault();
        window.print();
        return;
      }

      if (key === KEYS.DUPLICATE) {
        event.preventDefault();
        action_duplicateSelected();
        return;
      }

      if (key === KEYS.ROTATE) {
        action_rotateSelected();
        return;
      }

      if (key === KEYS.DELETE || key === KEYS.BACKSPACE) {
        action_deleteSelected();
        return;
      }

      if (
        key === KEYS.ARROW_UP ||
        key === KEYS.ARROW_DOWN ||
        key === KEYS.ARROW_LEFT ||
        key === KEYS.ARROW_RIGHT
      ) {
        keyboard_nudge(event, key);
      }
    }

    function keyboard_getKey(event) {
      const parts = [];

      if (event.ctrlKey || event.metaKey) {
        parts.push("ctrl");
      }

      parts.push(event.key.toLowerCase());

      return parts.join("+");
    }

    function keyboard_nudge(event, key) {
      const item = select_selectedItem();
      if (!item) return;

      event.preventDefault();

      const amount = event.shiftKey ? 10 : 1;

      if (key === KEYS.ARROW_UP) item.y -= amount;
      if (key === KEYS.ARROW_DOWN) item.y += amount;
      if (key === KEYS.ARROW_LEFT) item.x -= amount;
      if (key === KEYS.ARROW_RIGHT) item.x += amount;

      if (STATE.ui.snapToGrid) {
        item.x = util_snap(item.x);
        item.y = util_snap(item.y);
      }

      util_clampItem(item);

      action_commit("nudge");
      storage_save();
    }

    /* ============ SECTION: UTILITIES ============ */
    function util_id(prefix) {
      return prefix + "_" + Math.random().toString(36).slice(2, 10);
    }

    function util_number(value, fallback) {
      const number = Number(value);
      return Number.isFinite(number) ? number : fallback;
    }

    function util_clamp(value, min, max) {
      return Math.min(Math.max(value, min), max);
    }

    function util_snap(value) {
      return Math.round(value / GRID_SIZE) * GRID_SIZE;
    }

    function util_clampItem(item) {
      item.w = Math.max(20, util_number(item.w, 20));
      item.h = Math.max(20, util_number(item.h, 20));
      item.x = util_clamp(util_number(item.x, 0), 0, SCALE.canvas.w - item.w);
      item.y = util_clamp(util_number(item.y, 0), 0, SCALE.canvas.h - item.h);
    }

    function util_rectsOverlap(a, b) {
      return a.x < b.x + b.w &&
        a.x + a.w > b.x &&
        a.y < b.y + b.h &&
        a.y + a.h > b.y;
    }

    function util_findCollidingIds(items) {
      const collidingIds = new Set();

      for (let i = 0; i < items.length; i += 1) {
        for (let j = i + 1; j < items.length; j += 1) {
          if (util_rectsOverlap(items[i], items[j])) {
            collidingIds.add(items[i].id);
            collidingIds.add(items[j].id);
          }
        }
      }

      return collidingIds;
    }

    /* ============ SECTION: SELFTEST ============ */
    function selftest_run() {
      const results = [];

      function check(name, condition, detail) {
        results.push({
          name,
          pass: Boolean(condition),
          detail: detail === undefined ? "" : detail
        });
      }

      // --- schema_normalizeItem: defaults / fallbacks for missing fields ---
      const normalizedEmpty = schema_normalizeItem({});
      check(
        "schema_normalizeItem: missing fields fall back to PALETTE_ITEMS[0] + defaults",
        normalizedEmpty.sourceId === PALETTE_ITEMS[0].id &&
          normalizedEmpty.name === PALETTE_ITEMS[0].name &&
          normalizedEmpty.type === PALETTE_ITEMS[0].type &&
          normalizedEmpty.notes === "" &&
          normalizedEmpty.x === 40 &&
          normalizedEmpty.y === 40 &&
          normalizedEmpty.w === PALETTE_ITEMS[0].w &&
          normalizedEmpty.h === PALETTE_ITEMS[0].h &&
          normalizedEmpty.rotation === 0 &&
          normalizedEmpty.z === 1 &&
          typeof normalizedEmpty.id === "string" &&
          normalizedEmpty.id.length > 0,
        JSON.stringify(normalizedEmpty)
      );

      // --- schema_normalizeItem: invalid/non-numeric types coerce to fallback ---
      const normalizedInvalid = schema_normalizeItem({
        id: "fixed-id",
        sourceId: "custom-block",
        name: "Test Block",
        type: "block",
        x: "not-a-number",
        y: undefined,
        w: "NaN-ish",
        h: NaN,
        rotation: "oops",
        z: {}
      });
      check(
        "schema_normalizeItem: invalid numeric fields fall back to PALETTE_ITEMS[0] defaults",
        normalizedInvalid.x === 40 &&
          normalizedInvalid.y === 40 &&
          normalizedInvalid.w === PALETTE_ITEMS[0].w &&
          normalizedInvalid.h === PALETTE_ITEMS[0].h &&
          normalizedInvalid.rotation === 0 &&
          normalizedInvalid.z === 1 &&
          normalizedInvalid.id === "fixed-id",
        JSON.stringify(normalizedInvalid)
      );

      // --- schema_normalizeItem: valid numeric values pass through untouched ---
      const normalizedValid = schema_normalizeItem({
        id: "item_abc123",
        sourceId: "pan-1-2",
        name: "Half Pan",
        notes: "extra deep",
        type: "pan",
        x: 100,
        y: 250,
        w: 180,
        h: 240,
        rotation: 90,
        z: 4
      });
      check(
        "schema_normalizeItem: valid full item passes through unchanged",
        normalizedValid.id === "item_abc123" &&
          normalizedValid.x === 100 &&
          normalizedValid.y === 250 &&
          normalizedValid.w === 180 &&
          normalizedValid.h === 240 &&
          normalizedValid.rotation === 90 &&
          normalizedValid.z === 4,
        JSON.stringify(normalizedValid)
      );

      // --- schema_normalizeItem: w/h below minimum get clamped up to 20 ---
      const normalizedTiny = schema_normalizeItem({ w: 2, h: -5 });
      check(
        "schema_normalizeItem: w/h below 20 are raised to minimum 20",
        normalizedTiny.w === 20 && normalizedTiny.h === 20,
        JSON.stringify({ w: normalizedTiny.w, h: normalizedTiny.h })
      );

      // --- schema_normalizeLayout: null/non-object input returns empty layout shape ---
      const normalizedLayoutNull = schema_normalizeLayout(null);
      check(
        "schema_normalizeLayout: null input returns empty layout with items []",
        Array.isArray(normalizedLayoutNull.items) &&
          normalizedLayoutNull.items.length === 0 &&
          normalizedLayoutNull.schemaVersion === SCHEMA_VERSION,
        JSON.stringify(normalizedLayoutNull)
      );

      // --- schema_normalizeLayout: non-array items field becomes empty array ---
      const normalizedLayoutBadItems = schema_normalizeLayout({ items: "not-an-array" });
      check(
        "schema_normalizeLayout: non-array items field normalizes to []",
        Array.isArray(normalizedLayoutBadItems.items) && normalizedLayoutBadItems.items.length === 0,
        JSON.stringify(normalizedLayoutBadItems.items)
      );

      // --- schema_normalizeLayout: valid items array gets normalized per-item ---
      const normalizedLayoutGood = schema_normalizeLayout({
        items: [{ id: "x1", x: 5, y: 5, w: 50, h: 50, type: "note" }]
      });
      check(
        "schema_normalizeLayout: array of items normalizes each entry",
        normalizedLayoutGood.items.length === 1 &&
          normalizedLayoutGood.items[0].id === "x1" &&
          normalizedLayoutGood.items[0].type === "note",
        JSON.stringify(normalizedLayoutGood.items)
      );

      // --- util_clampItem: x/y far out of range get clamped within canvas bounds ---
      const clampedOver = { x: 999999, y: 999999, w: 100, h: 100 };
      util_clampItem(clampedOver);
      check(
        "util_clampItem: far out-of-range x/y clamp to canvas-w/h minus item size",
        clampedOver.x === SCALE.canvas.w - 100 && clampedOver.y === SCALE.canvas.h - 100,
        JSON.stringify(clampedOver)
      );

      // --- util_clampItem: negative x/y clamp to 0 ---
      const clampedNegative = { x: -500, y: -500, w: 50, h: 50 };
      util_clampItem(clampedNegative);
      check(
        "util_clampItem: negative x/y clamp to 0",
        clampedNegative.x === 0 && clampedNegative.y === 0,
        JSON.stringify(clampedNegative)
      );

      // --- util_clampItem: w/h below minimum raised to 20, and x/y reclamped accordingly ---
      const clampedTinySize = { x: 10, y: 10, w: -10, h: 0 };
      util_clampItem(clampedTinySize);
      check(
        "util_clampItem: w/h below 20 raised to 20",
        clampedTinySize.w === 20 && clampedTinySize.h === 20,
        JSON.stringify(clampedTinySize)
      );

      // --- util_clampItem: item exactly at canvas edge stays in bounds ---
      const clampedEdge = { x: SCALE.canvas.w - 20, y: SCALE.canvas.h - 20, w: 20, h: 20 };
      util_clampItem(clampedEdge);
      check(
        "util_clampItem: item exactly at canvas edge remains unchanged",
        clampedEdge.x === SCALE.canvas.w - 20 && clampedEdge.y === SCALE.canvas.h - 20,
        JSON.stringify(clampedEdge)
      );

      // --- util_snap: exact multiples of GRID_SIZE are unchanged ---
      check(
        "util_snap: exact multiple of GRID_SIZE (48) stays 48",
        util_snap(48) === 48,
        "util_snap(48) = " + util_snap(48)
      );

      // --- util_snap: halfway point rounds to nearest multiple (Math.round behavior) ---
      check(
        "util_snap: halfway point (12) rounds up to 24",
        util_snap(12) === 24,
        "util_snap(12) = " + util_snap(12)
      );

      // --- util_snap: negative numbers snap correctly ---
      check(
        "util_snap: negative number (-30) snaps to -24",
        util_snap(-30) === -24,
        "util_snap(-30) = " + util_snap(-30)
      );

      // --- util_number: NaN input falls back ---
      check(
        "util_number: NaN input returns fallback",
        util_number(NaN, 7) === 7,
        "util_number(NaN, 7) = " + util_number(NaN, 7)
      );

      // --- util_number: undefined input falls back ---
      check(
        "util_number: undefined input returns fallback",
        util_number(undefined, 9) === 9,
        "util_number(undefined, 9) = " + util_number(undefined, 9)
      );

      // --- util_number: numeric string coerces to number ---
      check(
        "util_number: numeric string '42' coerces to 42",
        util_number("42", 0) === 42,
        "util_number('42', 0) = " + util_number("42", 0)
      );

      // --- util_number: non-numeric string falls back ---
      check(
        "util_number: non-numeric string 'abc' returns fallback",
        util_number("abc", 3) === 3,
        "util_number('abc', 3) = " + util_number("abc", 3)
      );

      // --- util_id: correct prefix and non-empty suffix ---
      const id1 = util_id("item");
      const idParts = id1.split("_");
      check(
        "util_id: produces 'item_' prefix with non-empty suffix",
        id1.startsWith("item_") && idParts.length === 2 && idParts[1].length > 0,
        id1
      );

      // --- util_id: two calls produce different ids ---
      const id2 = util_id("item");
      check(
        "util_id: two successive calls produce different ids",
        id1 !== id2,
        id1 + " vs " + id2
      );

      // --- util_clamp: pure clamp helper sanity check (used internally by util_clampItem) ---
      check(
        "util_clamp: value within range/below min/above max all clamp correctly",
        util_clamp(5, 0, 10) === 5 && util_clamp(-5, 0, 10) === 0 && util_clamp(15, 0, 10) === 10,
        JSON.stringify({
          mid: util_clamp(5, 0, 10),
          low: util_clamp(-5, 0, 10),
          high: util_clamp(15, 0, 10)
        })
      );

      const passCount = results.filter((r) => r.pass).length;
      const totalCount = results.length;

      if (typeof console.table === "function") {
        console.table(
          results.map((r) => ({
            check: r.name,
            result: r.pass ? "PASS" : "FAIL",
            detail: r.detail
          }))
        );
      }

      results.forEach((r) => {
        const mark = r.pass ? "✓" : "✗";
        console.info(mark + " " + r.name + (r.detail ? " — " + r.detail : ""));
      });

      console.info("Selftest: " + passCount + "/" + totalCount + " passed");

      return results;
    }

    /* ============ SECTION: INIT ============ */
    function init() {
      action_hydrate(storage_load());

      document.addEventListener("click", handle_click);
      document.addEventListener("input", handle_input);

      if (FEATURE_FLAGS.keyboardShortcuts) {
        document.addEventListener("keydown", keyboard_key);
      }

      document.addEventListener("pointerdown", pointer_down);
      document.addEventListener("pointermove", pointer_move);
      document.addEventListener("pointerup", pointer_up);
      document.addEventListener("pointercancel", pointer_cancel);

      Bus.on("state:changed", render_schedule);

      render_all();

      if (FEATURE_FLAGS.selftest) {
        selftest_run();
      }
    }

    init();
  </script>
</body>
